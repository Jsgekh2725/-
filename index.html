<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020805">
<title>النشيد الوطني السعودي | Particle Project</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="stage"><canvas id="canvas" width="720" height="1280"></canvas></div>
<div class="controls">
  <button id="play">تشغيل</button>
  <button id="pause">إيقاف</button>
  <button id="restart">إعادة</button>
  <button id="record">تسجيل الفيديو</button>
  <label>الصوت <input id="volume" type="range" min="0" max="1" step="0.01" value="1"></label>
  <span id="status">جاهز</span>
</div>
<audio id="audio" preload="auto" src="reference-audio.mp3"></audio>
<script src="lyrics.js"></script>
<script src="app.js"></script>
</body>
</html>
