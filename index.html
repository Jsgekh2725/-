<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مختبر أدوات بايثون</title>
  <meta name="description" content="اكتب أدوات بايثون وشغّلها مباشرة في المتصفح">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐍</text></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <button id="menuBtn" class="icon-btn only-mobile" title="القائمة" aria-label="القائمة">☰</button>
    <div class="brand">
      <span class="brand-logo">🐍</span>
      <div>
        <h1>مختبر أدوات بايثون</h1>
        <p>اكتب الكود ← اضغط تشغيل ← شاهد النتيجة</p>
      </div>
    </div>

    <div id="status" class="status loading">
      <span class="dot"></span>
      <span id="statusText">جارٍ تحميل بايثون…</span>
    </div>

    <div class="top-actions">
      <button id="runBtn" class="btn btn-run" disabled title="Ctrl + Enter">
        <span class="run-icon">▶</span> تشغيل
      </button>
    </div>
  </header>

  <div class="layout">
    <!-- القائمة الجانبية -->
    <aside id="sidebar" class="sidebar">
      <div class="tabs">
        <button class="tab active" data-tab="examples">أمثلة جاهزة</button>
        <button class="tab" data-tab="mytools">أدواتي <span id="toolsCount" class="badge">0</span></button>
      </div>

      <div id="tab-examples" class="tab-body active">
        <ul id="examplesList" class="list"></ul>
      </div>

      <div id="tab-mytools" class="tab-body">
        <ul id="toolsList" class="list"></ul>
        <p id="toolsEmpty" class="empty">لا توجد أدوات محفوظة بعد.<br>اكتب أداة واضغط <b>حفظ</b>.</p>
      </div>

      <div class="sidebar-foot">
        الأدوات تُحفظ في متصفحك فقط (localStorage)
      </div>
    </aside>
    <div id="backdrop" class="backdrop"></div>

    <main class="workspace">
      <!-- المحرر -->
      <section class="panel editor-panel">
        <div class="panel-head">
          <input id="toolName" class="tool-name" type="text" placeholder="اسم الأداة…" maxlength="60">
          <div class="head-actions">
            <button id="newBtn" class="btn btn-ghost" title="أداة جديدة">＋ جديد</button>
            <button id="saveBtn" class="btn btn-ghost" title="Ctrl + S">💾 حفظ</button>
            <button id="openBtn" class="btn btn-ghost" title="فتح ملف .py">📂 فتح</button>
            <button id="downloadBtn" class="btn btn-ghost" title="تنزيل كملف .py">⬇ تنزيل</button>
            <button id="shareBtn" class="btn btn-ghost" title="نسخ رابط فيه الكود">🔗 مشاركة</button>
            <input id="fileInput" type="file" accept=".py,.txt" hidden>
          </div>
        </div>

        <div id="editor" class="editor"></div>

        <details class="extras">
          <summary>⚙ إعدادات التشغيل (مدخلات جاهزة ومكتبات إضافية)</summary>
          <div class="extras-grid">
            <label>
              <span>مدخلات جاهزة لـ <code>input()</code> — كل سطر قيمة</span>
              <textarea id="stdinBox" rows="3" dir="auto" placeholder="اتركه فارغاً وسيظهر لك مربع إدخال عند الحاجة"></textarea>
            </label>
            <label>
              <span>مكتبات إضافية من PyPI (مفصولة بمسافة أو فاصلة)</span>
              <input id="pkgBox" type="text" dir="ltr" placeholder="مثال: faker python-slugify">
              <small>مكتبات مثل numpy و pandas و matplotlib تُحمَّل تلقائياً عند استيرادها.</small>
            </label>
          </div>
        </details>
      </section>

      <!-- المخرجات -->
      <section class="panel output-panel">
        <div class="panel-head">
          <h2>المخرجات</h2>
          <span id="runTime" class="run-time"></span>
          <div class="head-actions">
            <button id="copyOutBtn" class="btn btn-ghost" title="نسخ المخرجات">📋 نسخ</button>
            <button id="clearBtn" class="btn btn-ghost" title="مسح المخرجات">🧹 مسح</button>
          </div>
        </div>
        <div id="output" class="console" dir="ltr" aria-live="polite"></div>
      </section>
    </main>
  </div>

  <div id="toast" class="toast" role="status"></div>

  <!-- محرر الكود -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"></script>

  <!-- بايثون (Pyodide) يتحمّل تلقائياً من app.js -->
  <script src="examples.js"></script>
  <script src="app.js"></script>
</body>
</html>
