<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discord 3-Character Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <div class="logo">D3</div>
      <div>
        <h1>مولّد يوزرات ديسكورد</h1>
        <p>ولّد يوزرات ثلاثية بأكثر من نمط</p>
      </div>
    </header>

    <section class="panel controls">
      <div class="field">
        <label for="count">عدد اليوزرات</label>
        <select id="count">
          <option value="25">25</option>
          <option value="50" selected>50</option>
          <option value="100">100</option>
          <option value="250">250</option>
          <option value="500">500</option>
          <option value="1000">1000</option>
        </select>
      </div>
      <div class="field">
        <label for="mode">نوع اليوزر</label>
        <select id="mode">
          <option value="letters">حروف فقط</option>
          <option value="numbers">أرقام فقط</option>
          <option value="mixed" selected>حروف وأرقام</option>
        </select>
      </div>
      <div class="field">
        <label for="pattern">النمط</label>
        <select id="pattern">
          <option value="random">عشوائي</option>
          <option value="lcc">حرف - حرف - حرف</option>
          <option value="lln">حرف - حرف - رقم</option>
          <option value="lnl">حرف - رقم - حرف</option>
          <option value="nll">رقم - حرف - حرف</option>
          <option value="nnl">رقم - رقم - حرف</option>
          <option value="nln">رقم - حرف - رقم</option>
          <option value="lnn">حرف - رقم - رقم</option>
        </select>
      </div>
      <button id="generate" class="primary">توليد اليوزرات</button>
    </section>

    <section class="stats">
      <div class="stat"><span id="total">0</span><small>النتائج</small></div>
      <div class="stat"><span id="unique">0</span><small>بدون تكرار</small></div>
    </section>

    <section class="panel results-panel">
      <div class="results-head">
        <h2>النتائج</h2>
        <div class="actions">
          <button id="copyAll">نسخ الكل</button>
          <button id="download">تحميل TXT</button>
        </div>
      </div>
      <div id="results" class="results">
        <div class="empty">اضغط «توليد اليوزرات» لعرض النتائج</div>
      </div>
    </section>
    <footer>مولّد أسماء فقط — لا يتحقق من توفر اليوزر على Discord.</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
