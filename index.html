<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0f1019">
  <meta name="description" content="RoGUI Studio — صانع واجهات روبلوكس بالسحب والإفلات مع أنميشنات وتأثيرات وتصدير سكربت Lua جاهز">
  <title>RoGUI Studio — صانع واجهات روبلوكس</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237f5cff'/%3E%3Cstop offset='1' stop-color='%2300c6ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cpath d='M32 12l5 15 15 5-15 5-5 15-5-15-15-5 15-5z' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;900&family=Inter:wght@400;500;700;800&family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Roboto:wght@400;700&family=Roboto+Mono&family=Arimo:wght@400;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;700&family=Oswald:wght@300;400;700&family=Nunito:wght@400;700&family=Merriweather&family=Fredoka:wght@600&family=Luckiest+Guy&family=Bangers&family=Creepster&family=Denk+One&family=Indie+Flower&family=Permanent+Marker&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Titillium+Web:wght@400;700&family=Amatic+SC:wght@700&family=Michroma&family=Patrick+Hand&family=Kalam&family=Josefin+Sans&family=Jura&family=Sarpanch&family=Fondamento&family=Grenze+Gotisch&family=Comic+Neue:wght@700&family=Orbitron:wght@500&family=Press+Start+2P&family=Cinzel:wght@400;700&family=EB+Garamond&family=Bodoni+Moda&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body data-mpanel="canvas">

  <header class="topbar">
    <div class="brand">
      <span class="logo">✦</span>
      <div class="brand-txt"><b>RoGUI</b><small>Studio</small></div>
    </div>
    <input id="projName" class="proj-name" type="text" maxlength="40" title="اسم المشروع">
    <div class="tb-actions">
      <button id="btnNew" class="btn ghost hide-sm" title="مشروع جديد">➕ <span>جديد</span></button>
      <button id="btnOpen" class="btn ghost" title="مشاريعي المحفوظة">📂 <span>مشاريعي</span></button>
      <button id="btnUndo" class="btn icon" title="تراجع (Ctrl+Z)">↶</button>
      <button id="btnRedo" class="btn icon" title="إعادة (Ctrl+Y)">↷</button>
      <button id="btnPlay" class="btn play" title="وضع التجربة (P)">▶ <span>تجربة</span></button>
      <button id="btnSave" class="btn primary" title="حفظ + السكربت (Ctrl+S)">💾 <span>حفظ</span></button>
      <button id="btnExport" class="btn accent hide-sm" title="السكربت (Ctrl+E)">📜 <span>السكربت</span></button>
      <button id="btnMore" class="btn icon" title="المزيد">⋯</button>
    </div>
  </header>

  <main class="ws">
    <!-- العناصر + المستكشف -->
    <aside class="panel" data-side="left">
      <div class="tabs">
        <button data-tab="tools">🧱 العناصر</button>
        <button data-tab="tree">🌳 المستكشف</button>
      </div>
      <div class="tab-pane" data-tab="tools">
        <div class="search-wrap"><input id="toolSearch" class="search" type="search" placeholder="ابحث: زر، صورة، UICorner، متجر..."></div>
        <div id="toolList" class="scroll"></div>
      </div>
      <div class="tab-pane" data-tab="tree">
        <div class="search-wrap"><input id="treeSearch" class="search" type="search" placeholder="ابحث في العناصر بالاسم أو النوع..."></div>
        <div id="tree" class="scroll"></div>
        <div class="tree-foot">اسحب العناصر لتغيير الأب أو الترتيب · نقرتين لإعادة التسمية · كليك يمين للخيارات</div>
      </div>
    </aside>

    <!-- اللوحة -->
    <section class="center">
      <div class="ctoolbar">
        <div class="tgroup">
          <select id="selScreen" title="حجم الشاشة"></select>
          <select id="selBg" title="خلفية المعاينة" class="hide-sm"></select>
        </div>
        <div class="tgroup">
          <button id="tgUnits" class="tg units" title="وحدة السحب">📏 Offset</button>
          <button id="tgSnap" class="tg" title="المحاذاة للشبكة">🧲</button>
          <button id="tgGrid" class="tg" title="إظهار الشبكة">▦</button>
          <select id="selGrid" title="حجم الشبكة" class="hide-sm"></select>
          <button id="tgHidden" class="tg hide-sm" title="إظهار العناصر المخفية في المحرر">👁</button>
        </div>
        <div class="tgroup align">
          <button data-align="left" title="محاذاة يسار">⇤</button>
          <button data-align="centerX" title="توسيط أفقي">↔</button>
          <button data-align="right" title="محاذاة يمين">⇥</button>
          <button data-align="top" title="محاذاة أعلى">⤒</button>
          <button data-align="centerY" title="توسيط عمودي">↕</button>
          <button data-align="bottom" title="محاذاة أسفل">⤓</button>
          <button data-align="fill" title="ملء الأب">⛶</button>
          <button id="toScale" title="تحويل الحجم والموقع إلى Scale (متجاوب)">S</button>
          <button id="toOffset" title="تحويل الحجم والموقع إلى Offset">O</button>
        </div>
        <div class="tgroup zoom">
          <button id="zoomOut" title="تصغير">−</button>
          <span id="zoomLabel">100%</span>
          <button id="zoomIn" title="تكبير">+</button>
          <button id="zoomFit" title="ملاءمة (F)">⤢</button>
        </div>
      </div>
      <div id="viewport" class="viewport">
        <div id="screenWrap" class="screen-wrap">
          <div id="screen" class="screen" dir="ltr">
            <div class="scene"><div class="sun"></div><div class="cloud c1"></div><div class="cloud c2"></div><div class="ground"></div><div class="baseplate"></div></div>
            <div id="guiArea" class="gui-area"></div>
            <div id="topbarSim" class="topbar-sim">
              <span class="tb-btn"><i class="rb-logo"></i></span>
              <span class="tb-btn"><i class="rb-chat"></i></span>
              <span class="tb-btn"><i class="rb-bp"></i></span>
              <span class="tb-inset-label">GUI Inset (58px)</span>
            </div>
            <div id="guides"></div>
            <div id="selBox" class="selbox">
              <div id="selLabel" class="sel-label"></div>
              <div class="h n" data-h="n"></div><div class="h s" data-h="s"></div>
              <div class="h e" data-h="e"></div><div class="h w" data-h="w"></div>
              <div class="h ne" data-h="ne"></div><div class="h nw" data-h="nw"></div>
              <div class="h se" data-h="se"></div><div class="h sw" data-h="sw"></div>
              <div class="h rot" data-h="rot" title="تدوير"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="statusbar">
        <span>🧱 العناصر: <b id="statCount">0</b></span>
        <span class="hide-sm">💡 Alt+نقر = تحديد الأب · Shift = الحفاظ على النسبة · Ctrl+عجلة = زوم</span>
        <span class="play-ind">● وضع التجربة</span>
      </div>
    </section>

    <!-- الخصائص + الأنميشن -->
    <aside class="panel" data-side="right">
      <div class="tabs">
        <button data-tab="props">🎛 الخصائص</button>
        <button data-tab="anim">✨ الأنميشن</button>
      </div>
      <div id="propHead" class="prop-head"></div>
      <div class="tab-pane" data-tab="props">
        <div class="search-wrap"><input id="propSearch" class="search" type="search" placeholder="ابحث عن خاصية: Size، لون، Font..."></div>
        <div id="propForm" class="scroll"></div>
      </div>
      <div class="tab-pane" data-tab="anim">
        <div class="search-wrap"><input id="animSearch" class="search" type="search" placeholder="ابحث في إعدادات الأنميشن..."></div>
        <div id="animForm" class="scroll"></div>
      </div>
    </aside>
  </main>

  <nav class="mobnav">
    <button data-p="tools">🧱<span>العناصر</span></button>
    <button data-p="tree">🌳<span>المستكشف</span></button>
    <button data-p="canvas">🖼<span>اللوحة</span></button>
    <button data-p="props">🎛<span>الخصائص</span></button>
    <button data-p="anim">✨<span>أنميشن</span></button>
  </nav>

  <div id="ctxmenu" class="ctxmenu"></div>
  <div id="modal-root"></div>
  <div id="toasts" class="toasts"></div>

  <script src="data.js"></script>
  <script src="render.js"></script>
  <script src="preview.js"></script>
  <script src="export.js"></script>
  <script src="app.js"></script>
</body>
</html>
