<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020503">
<title>النشيد الوطني السعودي | Particle Project</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="canvas" aria-hidden="true"></canvas>
<div class="vignette"></div>
<div class="scanlines"></div>
<header class="hud">
  <div class="brand">SAUDI NATIONAL ANTHEM <span>//</span> PARTICLE PROJECT</div>
  <div class="status"><i id="statusDot"></i><span id="status">جاهز</span></div>
</header>
<main>
  <section id="intro" class="scene active">
    <div class="particle-text" id="introText">النشيد الوطني السعودي</div>
    <div class="sub">DIGITAL NATIONAL IDENTITY</div>
  </section>
  <section id="lyrics" class="scene">
    <div id="lyricText" class="particle-text"></div>
    <div id="lyricIndex" class="counter">01 / 10</div>
  </section>
  <section id="end" class="scene">
    <div id="endText" class="particle-text small">مشروع الطالب راكان بن سعد القحطاني</div>
  </section>
</main>
<div class="controls">
  <button id="play" type="button">تشغيل</button>
  <button id="pause" type="button">إيقاف</button>
  <button id="restart" type="button">إعادة</button>
  <button id="record" type="button">تسجيل الفيديو</button>
  <label class="volume">الصوت <input id="volume" type="range" min="0" max="1" step="0.01" value="1"></label>
</div>
<audio id="audio" preload="auto" src="reference-audio.mp3"></audio>
<script src="lyrics.js"></script>
<script src="app.js"></script>
</body>
</html>
