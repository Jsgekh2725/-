<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0d12">
<title>Script Vault</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <header class="top">
    <div class="brand"><div class="logo">⌘</div><div><h1>Script Vault</h1><p>مساحة هادئة لحفظ سكربتاتك</p></div></div>
    <span class="status" id="status"><i></i> جاري الاتصال</span>
  </header>
  <section class="hero">
    <h2>احفظ سكربتك، وارجع له بأي وقت.</h2>
    <p>اكتب أو الصق السكربت هنا، ثم أرسله إلى مكتبتك.</p>
  </section>
  <section class="composer">
    <input id="scriptName" maxlength="80" placeholder="اسم السكربت (اختياري)" aria-label="اسم السكربت">
    <textarea id="scriptText" spellcheck="false" placeholder="الصق السكربت هنا..." aria-label="محتوى السكربت"></textarea>
    <div class="compose-footer"><span id="chars">0 حرف</span><button id="sendBtn">إرسال السكربت <span>↗</span></button></div>
  </section>
  <section class="library">
    <div class="library-head"><div><h3>مكتبتك</h3><p>السكربتات المحفوظة</p></div><span id="count">0</span></div>
    <div id="scripts" class="scripts"><div class="empty"><div class="empty-icon">⌁</div><p>ما فيه سكربتات محفوظة حالياً</p><small>أرسل أول سكربت عشان يظهر هنا</small></div></div>
  </section>
  <footer>Script Vault <span>•</span> بسيط، هادئ، ومنظم</footer>
</main>
<div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
